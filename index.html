<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAIEA OBRAS</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1B2A45" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Informe Obra" />
    <style>
      /* Pantalla de carga: se ve desde el primer instante, antes de que cargue la aplicación */
      .carga-saiea{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#F7F7F5;z-index:100;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .carga-saiea img{width:min(56vw,230px);height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.28))}
      .carga-saiea .giro{width:38px;height:38px;border-radius:50%;border:4px solid rgba(27,42,69,.18);border-top-color:#B8893B;animation:giro-saiea .9s linear infinite}
      .carga-saiea .txt{font-size:13px;color:#1B2A45;letter-spacing:.3px}
      @keyframes giro-saiea{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root"><div class="carga-saiea" data-carga><img src="/icono-saiea.png" alt="SAIEA OBRAS" /><div class="giro" role="status" aria-label="Cargando"></div><div class="txt">Cargando…</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
