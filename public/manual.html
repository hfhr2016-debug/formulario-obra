<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual de usuario — SAIEA OBRAS</title>
<style>
  :root { --navy:#1B2A45; --gold:#D9A227; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#E8E6E1; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:10; background:var(--navy); color:#fff; display:flex; align-items:center; gap:10px;
           padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top)); box-shadow:0 2px 6px rgba(0,0,0,.25); }
  header a.volver { background:var(--gold); color:var(--navy); font-weight:700; font-size:14px; text-decoration:none;
                    padding:9px 14px; border-radius:8px; white-space:nowrap; min-height:40px; display:inline-flex; align-items:center; }
  header .tit { flex:1; font-size:13px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header .pag { font-size:12px; color:var(--gold); white-space:nowrap; }
  header a.desc { color:#fff; opacity:.8; font-size:12px; text-decoration:underline; white-space:nowrap; }
  body.emb header { position:fixed; top:6px; right:8px; left:auto; padding:3px 10px; border-radius:12px; background:rgba(27,42,69,.85); box-shadow:none; }
  body.emb header .volver, body.emb header .tit, body.emb header .desc { display:none; }
  #hojas { max-width:900px; margin:0 auto; padding:12px 8px 40px; }
  .hoja { background:#fff; margin:0 auto 12px; box-shadow:0 1px 5px rgba(0,0,0,.2); position:relative; }
  .hoja canvas { display:block; width:100%; height:100%; }
  #estado { text-align:center; padding:40px 20px; color:var(--navy); font-size:14px; }
  #estado a { color:var(--navy); font-weight:700; }
  @media (max-width:520px) { header .tit { display:none; } header a.desc { display:none; } #hojas { padding:8px 4px 40px; } }
</style>
</head>
<body>
<header>
  <a class="volver" id="volver" href="/" data-volver>← Volver a la app</a>
  <div class="tit">📖 Manual de usuario</div>
  <div class="pag" id="pag"></div>
  <a class="desc" href="/manual-saiea-obras.pdf" download>Descargar PDF</a>
</header>
<div id="estado">Cargando el manual…</div>
<div id="hojas"></div>
<script>try{if(new URLSearchParams(location.search).get("embebido")==="1")document.body.classList.add("emb");}catch(e){}</script>
<script type="module">
const estado = document.getElementById("estado");
const cont = document.getElementById("hojas");
const pagEl = document.getElementById("pag");
function fallo() {
  estado.innerHTML = 'No se pudo mostrar el manual aquí. <a href="/manual-saiea-obras.pdf">Ábrelo como PDF</a> o toca «Volver a la app».';
}
try {
  const pdfjs = await import("/visor/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = "/visor/pdf.worker.min.mjs";
  const doc = await pdfjs.getDocument({ url: "/manual-saiea-obras.pdf" }).promise;
  const total = doc.numPages;
  const primera = await doc.getPage(1);
  const vp1 = primera.getViewport({ scale: 1 });
  estado.remove();
  const hojas = [];
  for (let i = 1; i <= total; i++) {
    const d = document.createElement("div");
    d.className = "hoja"; d.dataset.n = i;
    d.style.aspectRatio = vp1.width + " / " + vp1.height;
    cont.appendChild(d); hojas.push(d);
  }
  pagEl.textContent = "Pág. 1 / " + total;
  const hechas = new Set();
  async function pintar(n) {
    if (hechas.has(n)) return; hechas.add(n);
    const pg = await doc.getPage(n);
    const el = hojas[n - 1];
    const ancho = el.clientWidth || 600;
    const base = pg.getViewport({ scale: 1 });
    const esc = (ancho / base.width) * Math.min(window.devicePixelRatio || 1, 2);
    const vp = pg.getViewport({ scale: esc });
    const c = document.createElement("canvas");
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    await pg.render({ canvasContext: c.getContext("2d"), canvas: c, viewport: vp }).promise;
    el.appendChild(c);
  }
  const io = new IntersectionObserver((es) => { es.forEach((e) => { if (e.isIntersecting) pintar(+e.target.dataset.n); }); }, { rootMargin: "1200px 0px" });
  hojas.forEach((h) => io.observe(h));
  // Página visible
  const io2 = new IntersectionObserver((es) => {
    es.forEach((e) => { if (e.isIntersecting) pagEl.textContent = "Pág. " + e.target.dataset.n + " / " + total; });
  }, { rootMargin: "-45% 0px -45% 0px" });
  hojas.forEach((h) => io2.observe(h));
  window.__manualListo = total;
} catch (e) { console.error(e); fallo(); }
</script>
</body>
</html>
